name: buket_id
description: "Aplikasi penjualan buket bunga Buket.id"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  intl: ^0.20.0
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  shared_preferences: ^2.2.0
  http: ^1.1.0
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  device_preview: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Jakarta_Pusat/
    - assets/images/Jakarta_Selatan/
    - assets/images/Bogor/
    - assets/images/Depok/
    - assets/images/Tangerang/
    - assets/images/Bekasi/
    - assets/images/Jakarta_Timur/
    - assets/images/Jakarta_Barat/
    - assets/images/Jakarta_Utara/
    - assets/images/Tangerang_Selatan/
    - assets/icons/
    - assets/data/
