<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FFF5F8" stroke="#E91E63" stroke-width="2"/>
  
  <!-- Stems -->
  <path d="M 100 180 Q 95 140 100 100" stroke="#2E7D32" stroke-width="3" fill="none"/>
  <path d="M 100 180 Q 105 140 100 100" stroke="#388E3C" stroke-width="3" fill="none"/>
  <path d="M 100 180 Q 90 145 95 100" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
  <path d="M 100 180 Q 110 145 105 100" stroke="#388E3C" stroke-width="2.5" fill="none"/>
  
  <!-- Leaves -->
  <ellipse cx="80" cy="130" rx="8" ry="15" fill="#4CAF50" transform="rotate(-40 80 130)"/>
  <ellipse cx="120" cy="130" rx="8" ry="15" fill="#66BB6A" transform="rotate(40 120 130)"/>
  
  <!-- Main flowers (5 blooms arranged in bouquet pattern) -->
  
  <!-- Center flower - Red/Pink (largest) -->
  <g>
    <!-- Petals -->
    <circle cx="100" cy="60" r="12" fill="#E91E63" opacity="0.9"/>
    <circle cx="88" cy="72" r="12" fill="#E91E63" opacity="0.85"/>
    <circle cx="112" cy="72" r="12" fill="#E91E63" opacity="0.85"/>
    <circle cx="82" cy="88" r="12" fill="#E91E63" opacity="0.8"/>
    <circle cx="118" cy="88" r="12" fill="#E91E63" opacity="0.8"/>
    <!-- Center -->
    <circle cx="100" cy="78" r="8" fill="#F06292"/>
  </g>
  
  <!-- Top-left flower - Pink -->
  <g>
    <circle cx="70" cy="50" r="10" fill="#F48FB1" opacity="0.9"/>
    <circle cx="62" cy="58" r="10" fill="#F48FB1" opacity="0.85"/>
    <circle cx="78" cy="58" r="10" fill="#F48FB1" opacity="0.85"/>
    <circle cx="60" cy="70" r="10" fill="#F48FB1" opacity="0.8"/>
    <circle cx="80" cy="70" r="10" fill="#F48FB1" opacity="0.8"/>
    <!-- Center -->
    <circle cx="70" cy="62" r="6" fill="#EC407A"/>
  </g>
  
  <!-- Top-right flower - Pink -->
  <g>
    <circle cx="130" cy="50" r="10" fill="#F48FB1" opacity="0.9"/>
    <circle cx="122" cy="58" r="10" fill="#F48FB1" opacity="0.85"/>
    <circle cx="138" cy="58" r="10" fill="#F48FB1" opacity="0.85"/>
    <circle cx="120" cy="70" r="10" fill="#F48FB1" opacity="0.8"/>
    <circle cx="140" cy="70" r="10" fill="#F48FB1" opacity="0.8"/>
    <!-- Center -->
    <circle cx="130" cy="62" r="6" fill="#EC407A"/>
  </g>
  
  <!-- Left flower - Light Pink -->
  <g>
    <circle cx="55" cy="75" r="9" fill="#F8BBD0" opacity="0.9"/>
    <circle cx="48" cy="82" r="9" fill="#F8BBD0" opacity="0.85"/>
    <circle cx="62" cy="82" r="9" fill="#F8BBD0" opacity="0.85"/>
    <circle cx="47" cy="93" r="9" fill="#F8BBD0" opacity="0.8"/>
    <circle cx="63" cy="93" r="9" fill="#F8BBD0" opacity="0.8"/>
    <!-- Center -->
    <circle cx="55" cy="85" r="5" fill="#F06292"/>
  </g>
  
  <!-- Right flower - Light Pink -->
  <g>
    <circle cx="145" cy="75" r="9" fill="#F8BBD0" opacity="0.9"/>
    <circle cx="138" cy="82" r="9" fill="#F8BBD0" opacity="0.85"/>
    <circle cx="152" cy="82" r="9" fill="#F8BBD0" opacity="0.85"/>
    <circle cx="137" cy="93" r="9" fill="#F8BBD0" opacity="0.8"/>
    <circle cx="153" cy="93" r="9" fill="#F8BBD0" opacity="0.8"/>
    <!-- Center -->
    <circle cx="145" cy="85" r="5" fill="#F06292"/>
  </g>
</svg>